name: Scheduler database check

on:
  schedule:
    # Three small reads daily, away from the busy start of the hour (UTC).
    - cron: '23 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-healthcheck
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'jwlee9/home'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check database availability
        run: node scripts/scheduler-healthcheck.cjs
