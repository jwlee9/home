<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Simple scheduling service for groups">
    <title>Schedule · Jaewon Lee</title>
    <link rel="icon" type="image/svg+xml" href="../banana.svg">
    <link rel="stylesheet" href="schedule.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar"><a class="brand" href="../">Jaewon Lee</a><span>Schedule</span></header>
      <section id="create-view" class="create-view" aria-labelledby="create-title">
        <form id="create-form" class="create-form">
          <div class="form-heading"><p>NEW EVENT</p><h1 id="create-title">Create a schedule</h1></div>
          <label class="field field-title"><span>Name</span><input id="event-title" required maxlength="100" placeholder="String quartet rehearsal"></label>
          <div class="date-range">
            <label class="field"><span>From</span><input id="start-date" type="date" required></label>
            <label class="field"><span>To</span><input id="end-date" type="date" required></label>
          </div>
          <p id="date-summary" class="field-note">Choose the first and last day.</p>
          <div class="time-row">
            <label class="field"><span>Start</span><input id="start-time" type="time" value="10:00" required></label>
            <label class="field"><span>End</span><input id="end-time" type="time" value="22:00" required></label>
            <label class="field"><span>Interval</span><select id="slot-length"><option value="30">30 min</option><option value="15">15 min</option><option value="60">60 min</option></select></label>
          </div>
          <label class="field"><span>Time zone</span><select id="time-zone"><option value="Asia/Seoul">Korea Standard Time (KST)</option><option value="Asia/Tokyo">Japan Standard Time (JST)</option><option value="America/Los_Angeles">Pacific Time (PT)</option><option value="America/New_York">Eastern Time (ET)</option><option value="Europe/London">United Kingdom Time (UK)</option></select></label>
          <p id="create-error" class="form-error" role="alert"></p>
          <button class="button button-primary" type="submit">Create schedule</button>
        </form>
      </section>
      <section id="schedule-view" class="schedule-view is-hidden" aria-live="polite">
        <header class="event-header">
          <div><p id="event-meta" class="event-meta"></p><h1 id="event-name"></h1></div>
          <div class="event-actions"><button class="button button-quiet" id="copy-link" type="button">Copy link</button><button class="button button-quiet" id="new-schedule" type="button">New</button></div>
        </header>
        <section class="identity" aria-labelledby="name-label">
          <label id="name-label" class="field" for="participant-name"><span>Your name</span><input id="participant-name" maxlength="60" placeholder="Enter your name"></label>
          <button class="button button-primary" id="save-name" type="button">Start marking times</button>
          <p id="identity-status" class="field-note" aria-live="polite"></p>
        </section>
        <section class="availability-panel" aria-label="Availability">
          <div class="availability-topline">
            <div class="mode-switch" role="tablist" aria-label="Availability view">
              <button id="mode-mine" class="mode-button active" type="button" role="tab" aria-selected="true">My availability</button>
              <button id="mode-group" class="mode-button" type="button" role="tab" aria-selected="false">Group</button>
            </div>
            <p id="group-summary" class="group-summary is-hidden"></p>
          </div>
          <p class="grid-instruction" id="grid-instruction">Enter your name, then drag across the times you are available.</p>
          <p id="slot-details" class="slot-details is-hidden" aria-live="polite"></p>
          <div id="people-filter" class="people-filter is-hidden" aria-label="Participants"></div>
          <div class="calendar-wrap"><div id="calendar" class="calendar" role="grid"></div></div>
        </section>
        <section id="save-area" class="save-area"><button class="button button-primary" id="save-availability" type="button" disabled>Save available times</button><p id="save-status" aria-live="polite"></p></section>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="schedule.js"></script>
  </body>
</html>
